# Stage 5-1 (candidate generation) / 5-2 (hard mask) settings -- owner: taehyeon
# SI units: m, kg, N, rad. Development defaults; reasons in docs/taehyeon/hard_mask.md.
# Robot: HDR50-22 (robot reach/IK/payload are stage 6, not checked here).
schema_version: 1
candidates:
  cache_size: 256
  generation:
    yaw_set_rad: [0.0, 1.5707963267948966]   # 1st stage: 0 / 90 deg
    use_ems: true
    use_extreme_points: true
    ems_anchors: [corner_ll, corner_lr, corner_ul, corner_ur, center]
    balance_anchors: true                     # share mode: scan EMS for load-balanced spots of heavy boxes
    balance_step_m: 0.04                      # scan grid of the balance anchors
    dedup_distance_m: 0.08                    # 80 mm duplicate removal
    dedup_mode: support_aware                 # geometric | support_aware | mask_aware | off
    order: likely_valid_first                 # priority | likely_valid_first
    max_candidates: 0                         # 0 = unlimited
  uncertainty:                                # measurement uncertainty delta (from stage 2)
    lateral_clearance_m: 0.004
    size_tolerance_m: 0.002
    height_tolerance_m: 0.003
    cog_uncertainty_ratio: 0.05
    cog_uncertainty_min_m: 0.005
    uncertain_policy: robust                  # robust | reject
    uncertain_multiplier: 2.0
  constraints:
    min_support_ratio: 0.70
    min_lbcp_margin_m: 0.0
    pallet_overhang_m: 0.0
    default_pallet_max_weight_kg: 1000.0
    heavy_on_light:
      enabled: true
      mode: share                             # share (taehyeon 2026-10-08) | per_box (mission wording)
      max_weight_ratio: 1.0
      tolerance_kg: 0.5
      min_share: 0.10
    load_model:
      ect_n_per_m: 5000.0
      board_thickness_m: 0.003
      safety_factor: 4.0
      share_model: lever                      # lever | area
    pallet_cog:
      enabled: true
      final_half_extent_ratio: 0.5
      ramp_mass_kg: 150.0
      allow_improving: true
